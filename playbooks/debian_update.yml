---
- name: Mise à jour Debian – interactive
  hosts: "{{ target_hosts }}"
  become: true

  vars_prompt:
    - name: "target_hosts"
      prompt: "Quels hosts veux-tu mettre à jour ? (ex : webservers, 172.16.1.20, all)"
      private: no

  tasks:
    - name: Mise à jour des paquets
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes

