---
fail2ban_ignoreip:
  - "127.0.0.1/8"

fail2ban_bantime: "1h"
fail2ban_findtime: "10m"
fail2ban_maxretry: 5

# Backend systemd est souvent le plus simple sur Debian/Ubuntu
fail2ban_backend: "systemd"

# Jails à activer (tu peux en rajouter)
fail2ban_jails:
  - name: "sshd"
    enabled: true
    port: "ssh"
    logpath: "%(sshd_log)s"
    maxretry: 5
