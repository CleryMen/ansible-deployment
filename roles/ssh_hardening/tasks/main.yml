---
- name: S'assurer que le répertoire sshd_config.d existe
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Déployer la configuration de durcissement SSH
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: "{{ ssh_hardening_config_file }}"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Redémarrer SSH
