---
# Paramètres de durcissement SSH (surchargeables par inventaire ou en -e)
ssh_hardening_port: 22
ssh_hardening_permit_root_login: "no"
ssh_hardening_password_authentication: "no"
ssh_hardening_pubkey_authentication: "yes"
ssh_hardening_permit_empty_passwords: "no"
ssh_hardening_x11_forwarding: "no"
ssh_hardening_max_auth_tries: 3

# Emplacement du fichier de conf et nom du service
ssh_hardening_config_file: /etc/ssh/sshd_config.d/99-hardening.conf
ssh_hardening_service_name: ssh
